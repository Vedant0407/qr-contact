<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .qr-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
    }

    .btn-row {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-download {
      background: #38bdf8;
      color: #0f172a;
    }

    .btn-preview {
      background: #334155;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Setup Your Scanner Link</h1>

    <div class="form-group">
      <label>1. Your Phone Number (With Call Icon)</label>
      <input type="text" id="phone" value="+91 72240 98359" placeholder="e.g. +91 72240 98359" />
    </div>

    <div class="form-group">
      <label>2. WhatsApp Number (Chat Link)</label>
      <input type="text" id="wa" value="917224098359" placeholder="e.g. 917224098359" />
    </div>

    <div class="form-group">
      <label>3. Instagram Link / Handle</label>
      <input type="text" id="insta" value="https://instagram.com/yourhandle" placeholder="e.g. https://instagram.com/yourhandle" />
    </div>

    <div class="qr-container">
      <div id="qrcode"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-download" onclick="downloadQR()">Download QR (PNG)</button>
      <a class="btn btn-preview" id="preview-btn" target="_blank" href="index.html">Open Page</a>
    </div>
  </div>

  <script>
    let qr = null;

    function update() {
      const phone = document.getElementById('phone').value.trim();
      const wa = document.getElementById('wa').value.trim();
      const insta = document.getElementById('insta').value.trim();

      const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/index.html';
      const url = `${baseUrl}?phone=${encodeURIComponent(phone)}&wa=${encodeURIComponent(wa)}&insta=${encodeURIComponent(insta)}`;

      document.getElementById('preview-btn').href = url;

      const qrBox = document.getElementById('qrcode');
      qrBox.innerHTML = '';
      qr = new QRCode(qrBox, {
        text: url,
        width: 180,
        height: 180,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function downloadQR() {
      const img = document.querySelector('#qrcode img') || document.querySelector('#qrcode canvas');
      if (img) {
        const link = document.createElement('a');
        link.download = 'scanner-qr.png';
        link.href = img.src || img.toDataURL();
        link.click();
      }
    }

    document.querySelectorAll('input').forEach(input => input.addEventListener('input', update));
    window.addEventListener('load', update);
  </script>
</body>
</html>
